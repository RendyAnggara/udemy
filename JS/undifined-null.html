<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Undifined</title>
  </head>
  <script>
    //Undifined
    let name;

    if (name === undefined) {
      alert("UNDIFINED");
    } else {
      alert("NOT UNDIFINED");
    }

    //Null
    let firstname = null;

    if (firstname === undefined) {
      alert("Ya ini adalah undifined");
    } else if (firstname === null) {
      alert("Ya ini adalah null");
    } else {
      alert("apalah ini");
    }
  </script>
  <body></body>
</html>
