<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator Perbandingan</title>
</head>
    <script>
        let result = 5 == "5";
        document.writeln(result + "</br>");

        result = 5 === "5";
        document.writeln(result + "</br>");

        result = 13 > 12;
        document.writeln(result + "</br>");

        result = 13 < 12;
        document.writeln(result + "</br>");
    </script>
<body>
    
</body>
</html>
