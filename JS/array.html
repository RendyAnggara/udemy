<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array</title>
</head>
<body>
    <script>
        //Soal 1, Mencari data Kelinci
        const hewan = ["Anjing", "Babi", "Kelinci", "Kucing", "Beruang"];
        console.info(hewan[2]);

        //Soal 2, Menambahkan dan menghitung panjang data Hewan
        hewan.push("Kuda");
        console.info(hewan.length); 
        
        //Soal 3, Mengubah Data
        const kegiatan = ["Bermain", "Belajar", "Tidur"];
        kegiatan[2] = "Makan";
        console.info(kegiatan);

        //Soal 4, Menghapus Data
        const angka = [29, 89, 82, 32, 67];
        delete angka[1];
        console.info(angka);
    </script>
</body>
</html>
