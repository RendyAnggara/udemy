<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oprasi Augmented Assigment</title>
</head>
        <script>
        let angka = 1 + 2; // 3
        document.writeln("<p>1 + 2 = "+ angka + "</p>");

        angka -=2;// 1
        document.writeln("<p>3 - 2 = "+ angka + "</p>");

        angka *=3;// 3
        document.writeln("<p>1 x 3 = "+ angka + "</p>");

        angka **=2; // 9
        document.writeln("<p> 3 pangkat 2 = "+ angka + "</p>");
    </script>
<body>
</body>
</html>
