<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch Statement</title>
</head>
    <script>
        const nilai = "D";

        switch (nilai) {
            case "A":
                document.writeln("Anda lulus dengan sangat ahli");
                break;
            case "B":
            case "C":
                document.writeln("Anda lulus");
                break;
            case "D":
                document.writeln("Anda tidak lulus");
                break;
            default:
                document.writeln("Coba kembali ke Sekolah lagi");
                break;
        }
    </script>
<body>
    
</body>
</html>
