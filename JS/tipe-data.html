<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
    <script>
        document.writeln( 100 ); //Integer
        document.writeln("</br>");
        document.writeln("Hello World"); // String (bisa memakai "" atau '')
        document.writeln("</br>");
        document.writeln( 12.124 ); //Untuk data desimal
        document.writeln("</br>");
        document.writeln( 0x1212 )// Untuk number HexaDesimal
        document.writeln("</br>");
        document.writeln( 0b111010 ); //Untuk number Binary
        document.writeln("</br>");
        document.writeln( 0o303 );// untuk number Octal
        document.writeln("</br>");
        //boolean
        document.writeln(false); //salah
        document.writeln("</br>");
        document.writeln(true); //benar
        document.writeln("</br>");
        //Menambah String
        document.writeln("Nama: " + "Rendy");
        document.writeln("</br>");
        //escape sequence
        document.writeln("<textarea cols='100' rows='10'> ");
        document.writeln("Rendya \nAnggara");
        document.writeln("\"Hidup cuma sekali, jadi makan lah.\"")
        document.writeln("true\\false");
        document.writeln("makan \tayam");
        document.writeln('\'ayam enak tau\'')
        document.writeln("</textarea>");
    </script>
<body>
    
</body>
</html>
