<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unary</title>
</head>
    <script>
        let angka = +1; // 1
        document.writeln(angka + "</br>");
        
        angka--; // 0
        document.writeln(angka + "</br>");

        angka++; //1
        document.writeln(angka + "</br>");

        angka = -angka; //-1
        document.writeln(angka + "</br>");
    </script>
<body>
</body>
</html>
