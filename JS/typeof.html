<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Operator Typeof</title>
  </head>
  <script>
    let data = "Rendy";

    let typedata = typeof data;
    document.writeln(`${data} = ${typedata}`);
  </script>
