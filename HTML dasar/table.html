<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table</title>
  </head>
  <body>
    <h1>Table Nilai</h1>
    <table style="border: 2px solid black">
      <colgroup>
        <col span="2" style="background-color: aqua" />
        <col style="background-color: greenyellow" />
      </colgroup>
      <thead>
        <tr>
          <th>Nama</th>
          <th>Asal Kota</th>
          <th>Nilai</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Rendy</td>
          <td>Karawang</td>
          <td>100</td>
        </tr>
      </tbody>
      <tbody>
        <tr>
          <td>Budi</td>
          <td>Jember</td>
          <td>89</td>
        </tr>
      </tbody>
      <tbody>
        <tr>
          <td>Gerry</td>
          <td>Sumedang</td>
          <td>87</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td rowspan="2">Total</td>
          <td>Total</td>
          <td>276</td>
        </tr>
        <tr>
          <td>Rata rata</td>
          <td>92</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
