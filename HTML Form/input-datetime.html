<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Date time</title>
  </head>
  <body>
    <form action="">
      <label for="datetime"></label>
      <input
        type="datetime-local"
        name="tanggal-bulan-tahun-waktu"
        id="datetime"
        value="2025-01-01T00:00"
        min="2025-08-29T12:00"
      />
      <input type="submit" value="Simpan" />
    </form>
  </body>
</html>
